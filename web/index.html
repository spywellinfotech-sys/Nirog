<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="theme-color" content="#0B57C2">
<meta name="description" content="Yada+: find doctors, labs and hospitals, and book appointments.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yada+">
<title>Yada+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, centered on larger screens. Doctor list -> doctor + slot picker -> confirm -> appointments tab. */
/* red and white: crimson for text and buttons, brighter red for fills, white surfaces */
:root{
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --bg:#F3F8FD; --surface:#FFFFFF; --line:#D5E3F2; --ink:#0E1F36; --muted:#4A5F7A;
  --brand:#0B57C2; --brand-ink:#FFFFFF; --soft:#DCEAFB; --accent:#084A9E; --accent-soft:#E8F1FC;
  --bright:#0B6BC2; --on-bright:#FFFFFF; --green:#1B7F5C; --green-soft:#DDF1E7;
  --bad:#B3261E; --bad-soft:#FBE4E1; --busy:#E7EEF6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1522; --surface:#101F31; --line:#223A55; --ink:#E8F1FB; --muted:#9DB4CF;
  --brand:#5AA8FF; --brand-ink:#03142A; --soft:#14304F; --accent:#7FC0FF; --accent-soft:#12283F;
  --bright:#4C9BF5; --on-bright:#03142A; --green:#5FD3A0; --green-soft:#14301F;
  --bad:#FF8B80; --bad-soft:#3A1B18; --busy:#14263A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1522; --surface:#101F31; --line:#223A55; --ink:#E8F1FB; --muted:#9DB4CF;
  --brand:#5AA8FF; --brand-ink:#03142A; --soft:#14304F; --accent:#7FC0FF; --accent-soft:#12283F;
  --bright:#4C9BF5; --on-bright:#03142A; --green:#5FD3A0; --green-soft:#14301F;
  --bad:#FF8B80; --bad-soft:#3A1B18; --busy:#14263A; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#app{border-top:5px solid var(--bright);max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.pad{padding-inline:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 16px 8px}
.brand{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.02em;color:var(--brand)}
.brand .logo{height:36px;width:auto;display:block;vertical-align:middle;pointer-events:none;-webkit-user-drag:none}
.brand:has(.logo){display:flex;align-items:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .logo{background:#fff;border-radius:10px;padding:3px 8px}}
:root[data-theme="dark"] .brand .logo{background:#fff;border-radius:10px;padding:3px 8px}
.brand small{font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;margin-left:8px}
.title-block{padding:6px 16px 14px}
.title-block h1{font-size:28px;line-height:1.1}
.title-block p{margin:6px 0 0;color:var(--muted)}

/* search + chips */
.search{margin:0 16px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-width:0}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:13px 0;outline:none}
.search:focus-within{border-color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* doctor cards */
.list{display:flex;flex-direction:column;gap:10px;padding:12px 16px 24px}
.count{padding:10px 16px 0;font-size:13px;color:var(--muted)}
.doc{display:flex;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.doc:hover{border-color:var(--brand)}
.av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px;background:var(--soft);color:var(--brand)}
.av.lg{width:64px;height:64px;font-size:22px}
.doc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.doc-name{font-weight:700;font-size:16px}
.doc-sub{color:var(--muted);font-size:13.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rate{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:13px}
.rate svg{color:var(--bright)}
.next{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.next b{color:var(--brand)}
.fee{font-weight:700;white-space:nowrap}

/* doctor detail */
.bar{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font-weight:600;color:var(--brand);padding:6px 8px 6px 0}
.profile{display:flex;gap:14px;padding:8px 16px 4px;align-items:center}
.profile h1{font-size:23px;line-height:1.15}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px 4px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
.fact b{display:block;font-family:var(--font-display);font-size:18px}
.fact span{font-size:12px;color:var(--muted)}
.about{padding:10px 16px 0;color:var(--muted);font-size:14px}
.sec{padding:20px 16px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{margin:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.seg button small{font-weight:500;color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg button[aria-pressed="true"] small{color:var(--brand-ink);opacity:.85}
.dates{display:flex;gap:8px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:none;width:58px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.date .d{font-size:12px;color:var(--muted);font-weight:500}
.date .n{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.1}
.date .c{font-size:11px;color:var(--muted)}
.date[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.date[aria-pressed="true"] .d,.date[aria-pressed="true"] .c{color:var(--brand-ink);opacity:.85}
.date:disabled{opacity:.45;cursor:not-allowed}
.period{padding:10px 16px 0}
.period h3{font-size:14px;font-family:var(--font-body);font-weight:600;color:var(--muted);margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;font-weight:600;font-size:14px;min-width:0}
.slot:hover:not(:disabled){border-color:var(--brand)}
.slot[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.slot.blocked{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.slot.booked:disabled{background:var(--soft);color:var(--brand);text-decoration:none;border-color:transparent;font-weight:700}
.slot:disabled{background:var(--busy);color:var(--muted);text-decoration:line-through;cursor:not-allowed;border-color:transparent;font-weight:500}
.empty{margin:14px 16px;padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.legend{padding:12px 16px 0;font-size:12px;color:var(--muted)}

/* sticky bars */
.stick{position:sticky;bottom:0;margin-top:auto;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.cta-sum{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:10px}
.cta-sum b{font-weight:700}
.btn{width:100%;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;padding:14px;font-size:16px}
.btn:disabled{background:var(--busy);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--bad);color:var(--surface)}
.fab{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:#C62828;color:#fff;font-weight:700;font-size:14px;padding:12px 16px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.fab svg{flex:none}
.natamb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.natamb:first-of-type{border-top:0}
.natamb .btn{flex:none;width:auto;min-width:96px;justify-content:center;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.natamb b.num{font-size:22px;letter-spacing:.02em}
.nav{display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--brand)}
.badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--accent);color:var(--surface);border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}

/* form */
.card{margin:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumrow:last-child{border-bottom:0}
.sumrow span:first-child{color:var(--muted)}
.sumrow span:last-child{text-align:right;font-weight:600;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:14px}
.field input,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.err{color:var(--bad);font-size:13px}
.hint{color:var(--muted);font-size:12.5px}

/* done + appointments */
.done{padding:28px 16px 8px;text-align:center}
.tick{width:64px;height:64px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.ref{display:inline-block;margin-top:10px;font-weight:700;letter-spacing:.06em;background:var(--soft);color:var(--brand);padding:6px 12px;border-radius:8px}
.appt{margin:0 16px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.appt-head{display:flex;gap:12px;align-items:center;min-width:0}
.when{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:600;flex-wrap:wrap}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--brand);letter-spacing:.02em}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.confirm{background:var(--bad-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.foot{padding:4px 16px 24px;font-size:12px;color:var(--muted);text-align:center}
.phoneio{display:flex;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.phoneio:focus-within{border-color:var(--brand)}
.phoneio .cc{padding:12px;background:var(--soft);font-weight:700;color:var(--brand)}
.field .phoneio input{border:0;border-radius:0;flex:1;min-width:0}
.demo-note{background:var(--accent-soft);border-radius:10px;padding:12px;font-size:14px;margin-bottom:14px}
.demo-note .code{display:inline-block;font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.14em;margin-left:4px}
a.btn{display:block;text-align:center;text-decoration:none}
a.btn.sm{display:inline-block}
.maplink{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--brand);text-decoration:none;font-size:14px}
.maplink:hover{text-decoration:underline}
.locrow{display:flex;gap:12px;align-items:flex-start}
.pinbox{flex:none;width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--brand);display:grid;place-items:center}
.days{display:flex;flex-wrap:wrap;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mapfind{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.status-line{font-size:13px;font-weight:600;color:var(--brand);min-height:1em}
.loc{display:flex;align-items:center;gap:8px;margin:0 16px 10px;color:var(--brand)}
.loc label{font-size:13px;font-weight:600;color:var(--muted)}
.loc select{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-weight:600;color:var(--ink)}
.loc select:focus{outline:none;border-color:var(--brand)}
/* staff area */
.stack{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.list .appt{margin:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kl{font-size:12px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--font-display);font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.ks{font-size:12px;color:var(--muted)}
.track{height:10px;border-radius:5px;background:var(--busy);overflow:hidden;margin:10px 0 8px}
.track i{display:block;height:100%;background:var(--bright);border-radius:5px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.chart .bar{fill:var(--bright);pointer-events:none}
.chart .val{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--font-body)}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--soft)}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;max-width:220px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.cardhead h2{font-size:16px}
.link{border:0;background:transparent;color:var(--brand);font-weight:600;font-size:13px;padding:4px 0}
.rep{margin-bottom:14px}
.rep:last-child{margin-bottom:0}
.rep-h{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:6px;flex-wrap:wrap}
.rn{font-weight:600}
.rtrack{position:relative;height:10px;background:var(--busy);border-radius:5px}
.rtrack i{position:absolute;left:0;top:0;bottom:0;background:var(--bright);border-radius:5px}
.rtrack u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--green);text-decoration:none}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:0}
.rank{width:22px;text-align:center;font-family:var(--font-display);font-weight:700;color:var(--muted)}
.lb.me{font-weight:700}
.lb .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.fr{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13.5px}
.fr:last-child{margin-bottom:0}
.fr .fl{width:84px;flex:none}
.fr .ft{flex:1;height:10px;background:var(--busy);border-radius:5px;min-width:0}
.fr .ft i{display:block;height:100%;background:var(--bright);border-radius:5px}
.fr .fv{width:28px;text-align:right;font-weight:600}
.callout{margin:0 16px;padding:12px 14px;background:var(--accent-soft);border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.field select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th,.t td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.t td:last-child,.t th:last-child{text-align:right}
.scroll-x{overflow-x:auto}
.who{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.who>div{min-width:0}
.tiny{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.sel{user-select:all}
.legend-line{display:inline-block;width:2px;height:10px;background:var(--green);vertical-align:-1px;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.doc,.slot,.date,.chip,.btn{transition:border-color .12s,background-color .12s}}

.pbtn{display:inline-flex;align-items:center;gap:6px;max-width:48%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;font-weight:600;font-size:14px;color:var(--brand)}.pbtn .av{margin:0!important}.pbtn span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.vtag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--green-soft,#DDF3EA);color:var(--green)}
.vtag svg{width:12px;height:12px}
.upl{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.upl>b{font-size:14px}
.pick{position:relative;display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-height:40px;padding:0 14px;border:1px solid var(--brand);border-radius:10px;color:var(--brand);font-weight:700;font-size:14px;cursor:pointer;background:var(--surface)}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:0;font-size:14px;line-height:1;cursor:pointer;padding:0}
.filechip{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--bg)}
.filechip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px}
.gal button{flex:none;width:132px;height:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--soft);cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;z-index:50;background:rgba(20,10,0,.88);display:grid;place-items:center;padding:16px;border:0;width:100%;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.chk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chk i{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--brand);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.chk[aria-pressed="true"] i{background:var(--green);border-color:var(--green)}
.vbox{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.vbox select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;max-width:100%}
.lab .tests{display:flex;flex-wrap:wrap;gap:6px}
.lab .tests span{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.lab .tests b{font-variant-numeric:tabular-nums}
.bell{position:relative;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--brand)}
.bell i{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--surface);border-radius:999px;font-style:normal;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.topr{display:flex;align-items:center;gap:8px}
.ntoast{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);z-index:60;background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw}
.ntoast button{background:none;border:0;color:#fff;text-decoration:underline;font-weight:700;margin-left:8px}
.nitem{border-bottom:1px solid var(--line);padding:12px 0;font-size:14px}.nitem.un{font-weight:600}.nitem small{display:block;color:var(--muted,#777);font-weight:400;margin-top:2px}

/* ---------- Google Maps helpers ---------- */
function isNum(x){return typeof x==="number"&&isFinite(x)}
/* Accepts a Google Maps link or a "lat, lng" pair. Returns {url,lat,lng} or null. */
function parseMap(s){
  s=String(s||"").trim();
  if(!s)return null;
  var m=s.match(/^(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);
  if(m){
    var la=+m[1],ln=+m[2];
    if(Math.abs(la)<=90&&Math.abs(ln)<=180)return {url:"https://www.google.com/maps/search/?api=1&query="+la+","+ln,lat:la,lng:ln};
    return null;
  }
  var u;
  try{u=new URL(s)}catch(e){return null}
  if(u.protocol!=="https:")return null;
  var h=u.hostname.toLowerCase(),ok=false;
  if(h==="maps.app.goo.gl")ok=true;
  else if(h==="goo.gl"&&u.pathname.indexOf("/maps")===0)ok=true;
  else if(/^(www\.|maps\.)?google\.(com|co\.in|in)$/.test(h)&&(u.pathname.indexOf("/maps")===0||h.indexOf("maps.")===0))ok=true;
  if(!ok)return null;
  var t=u.href.replace(/%2C/gi,","),c=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||t.match(/[?&](?:q|query|ll|destination|daddr)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
  var out={url:u.href};
  if(c&&Math.abs(+c[1])<=90&&Math.abs(+c[2])<=180){out.lat=+c[1];out.lng=+c[2]}
  return out;
}
function siteOpen(d){
  var p=parseMap(d.mapUrl);
  if(p)return p.url;
  if(isNum(d.lat)&&isNum(d.lng))return "https://www.google.com/maps/search/?api=1&query="+d.lat+","+d.lng;
  return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([d.clinic,d.address,d.city].filter(Boolean).join(", "));
}
function siteDir(d){
  if(isNum(d.lat)&&isNum(d.lng))return "https://www.google.com/maps/dir/?api=1&destination="+d.lat+","+d.lng;
  return siteOpen(d);
}

function mapStatus(s){

}

var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad2(n){return n<10?"0"+n:""+n}
function dkey(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function fromKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function t12(t){var p=t.split(":"),h=+p[0],m=p[1];return (h%12===0?12:h%12)+":"+m+" "+(h<12?"AM":"PM")}
function money(n){return "₹"+n.toLocaleString("en-IN")}
function byId(id){for(var i=0;i<DOCS.length;i++)if(DOCS[i].id===id)return DOCS[i]}
/* A booking can outlive its doctor's public listing (deleted, rejected, not loaded yet). Never let that break a screen. */
function docOrGone(id){return byId(id)||{id:id,name:"Doctor (not listed now)",spec:"",clinic:"",city:"",address:"",fee:0,vfee:0,photo:"",lat:null,lng:null,rating:0,reviews:0,video:false}}
function avatar(d,cls){return '<div class="av'+(cls?' '+cls:'')+'">'+(d.photo?'<img src="'+esc(d.photo)+'" alt="">':esc(initials(d.name)))+'</div>'}
function vtag(d){return d.verified?'<span class="vtag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Verified</span>':''}
function initials(n){return n.replace("Dr. ","").split(" ").map(function(w){return w[0]}).join("").slice(0,2)}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0}return h}
function rel(k){
  var t=new Date(),a=fromKey(k),n0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  var diff=Math.round((a-n0)/86400000);
  if(diff===0)return "Today";if(diff===1)return "Tomorrow";
  return DAY[a.getDay()]+" "+a.getDate()+" "+MON[a.getMonth()];
}
function longDate(k){var a=fromKey(k);return DAY[a.getDay()]+", "+a.getDate()+" "+MON[a.getMonth()]}

/* Doctors set their own hours: doc.days (weekdays), doc.hours (sessions in minutes since midnight), doc.step (minutes per visit),
   doc.off (days off), doc.blocked (single slots they closed, "date|time"). */
function allTimes(doc){
  var out=[];
  doc.hours.forEach(function(b){
    for(var m=b[0];m+doc.step<=b[1];m+=doc.step){out.push(pad2(Math.floor(m/60))+":"+pad2(m%60))}
  });
  return out;
}
function isOff(doc,k){return (doc.off||[]).indexOf(k)>-1}
function worksDay(doc,k){return doc.days.indexOf(fromKey(k).getDay())>-1}
function works(doc,k){return worksDay(doc,k)&&!isOff(doc,k)}
function bookedKey(id,k,t){return id+"|"+k+"|"+t}

function supWho(){
  if(state.staff){var u=getUser(state.staff);return u?u.name+" ("+({admin:"Super admin",doctor:"Doctor",sales:"Sales",facility:"Facility"}[u.role]||u.role)+")":""}
  return state.pat?state.pat.name+", mobile "+state.pat.phone:"";
}
function supText(){var w=supWho();return "Hello Yada+ support, I need help with: "+(w?"\n\n(From: "+w+")":"")}

function helpFoot(){return '<div style="text-align:center;padding:6px 0 6px">'+(CLOUD&&BE.signedIn()?'<button class="btn sm ghost" data-a="ref">Refer and earn</button> ':'')+'<button class="btn sm ghost" data-a="help">Help and support</button></div><div style="text-align:center;padding:0 0 18px">'+logoutLink()+'</div>'}
/* Logging out lives only on the profile page (patients) or the foot of the dashboard (doctors, facilities), and always asks first. */
function logoutLink(){return '<button class="link" data-a="lask" style="font-size:12px;color:var(--muted)">Log out</button>'}
function vLogoutAsk(){
  return '<div class="top"><div class="brand">'+LOGO+'<small>Log out</small></div></div><div class="title-block"><h1>Log out?</h1><p>You will need to sign in again to see your appointments.</p></div><div class="card" style="display:flex;flex-direction:column;gap:10px"><button class="btn" style="background:#C62828" data-a="lyes">Yes, log out</button><button class="btn ghost" data-a="lno">Stay signed in</button></div>';
}
function doLogout(){
  state.loAsk=false;
  if(CLOUD){cloudLogout();return}
  state.help=false;state.notif=false;
  if(state.staff){state.staff=null}else{state.pat=null;savePat()}
  state.view="list";state.tab="find";state.ask=null;render(true);
}
var PRIVACY_URL='https://spywellinfotech-sys.github.io/Nirog/privacy.html';
function delSection(){
  if(!CLOUD||!BE.signedIn())return '';
  var su=state.staff?getUser(state.staff):null;if(su&&(su.role==="admin"||su.role==="sales"))return '';
  if(state.delAsk)return '<div class="sec">Delete account</div><div class="card"><div style="font-weight:600;margin-bottom:6px">Delete your account?</div><div class="tiny" style="margin-bottom:12px">Your personal details are erased, open appointments are cancelled and you are signed out. Doctors and facilities are taken off the listing. This cannot be undone.'+(state.delErr?'<div class="err" style="margin-top:8px">'+esc(state.delErr)+'</div>':'')+'</div><div style="display:flex;gap:10px"><button class="btn" style="background:#C62828" data-a="delyes"'+(state.delBusy?' disabled':'')+'>Yes, delete my account</button><button class="btn ghost" data-a="delno">Keep my account</button></div></div>';

}
function vHelp(){
  var has=SUP.email||SUP.wa,out='';
  if(SUP.wa)out+='<a class="btn" style="text-decoration:none;display:flex;justify-content:center" href="'+esc(supWa())+'" target="_blank" rel="noopener">Chat on WhatsApp</a>';
  if(SUP.email)out+='<a class="btn ghost" style="text-decoration:none;display:flex;justify-content:center" href="'+esc(supMail())+'" target="_blank" rel="noopener">Email support</a>';
  return '<div class="top"><div class="brand">'+LOGO+'<small>Help</small></div><button class="btn sm ghost" data-a="hclose">Close</button></div><div class="title-block"><h1>Help and support</h1><p>Questions about a booking, a doctor or your account? Reach us here.</p></div>'+
   '<div class="card" style="display:flex;flex-direction:column;gap:10px">'+(has?out+'<div class="hint">Your message opens ready to send. Support replies during working hours.</div>':'<div class="empty">Support contact is not set up yet. Please check back soon.</div>')+'</div>'+
   '<div style="text-align:center;padding:6px 0 4px"><a href="'+esc(PRIVACY_URL)+'" target="_blank" rel="noopener noreferrer" style="font-size:13px;color:var(--brand)">Privacy Policy</a></div>'+delSection();
}
function supCard(){
  var f=state.supf||(state.supf={email:SUP.email,wa:SUP.wa,err:"",ok:""});
  return '<div class="card"><div class="cardhead"><h2>Help and support</h2><span class="pill'+(SUP.email||SUP.wa?'':' warn')+'">'+(SUP.email||SUP.wa?"Live":"Not set")+'</span></div>'+
   '<div class="hint" style="margin-bottom:12px">Patients, doctors and facilities see these as Email and WhatsApp buttons under Help and support.</div>'+
   '<form id="supForm" novalidate><div class="field"><label for="sup-email">Support email</label><input id="sup-email" type="email" inputmode="email" value="'+esc(f.email)+'" placeholder="support@yourdomain.com"></div>'+

   '<button class="btn" type="submit" style="margin-top:8px">Save support contacts</button></form></div>';
}
function saveSupForm(){
  var f=state.supf;if(!f)return;var em=f.email.trim(),wa=f.wa.trim();f.ok="";f.err="";
  if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){f.err="Enter a valid email address.";render();return}
  if(wa&&!/^\+?[\d\s-]{10,16}$/.test(wa)){f.err="Enter a valid WhatsApp number (10 to 15 digits).";render();return}
  SUP.email=em;SUP.wa=wa;saveSup();f.ok="Saved.";render();
}
/* ---------- in-app notifications ---------- */
var NOTIF=(function(){if(CLOUD)return [];try{var r=JSON.parse(localStorage.getItem("nirog-notif-v1"));if(Array.isArray(r))return r}catch(e){}return []})();
function saveNotif(){if(CLOUD)return;try{localStorage.setItem("nirog-notif-v1",JSON.stringify(NOTIF.slice(-300)))}catch(e){}}
function notify(to,text){NOTIF.push({id:"n"+Date.now()+Math.floor(Math.random()*1e4),to:to,text:text,ts:Date.now(),read:false});saveNotif()}
function notifKey(){
  if(state.staff){var u=getUser(state.staff);if(!u)return null;return u.role==="doctor"?"d:"+u.docId:u.role==="facility"?"f:"+u.id:u.role==="admin"?"admin":"u:"+u.id}
  return state.pat?"p:"+state.pat.phone:null;
}
function unreadN(){var k=notifKey();return k?NOTIF.filter(function(n){return n.to===k&&!n.read}).length:0}
function hasLogin(d){return staffData.users.some(function(u){return u.role==="doctor"&&u.docId===d.id})}
function bellBtn(){
  var k=notifKey();if(!k)return "";var n=unreadN();
  return '<button class="bell" data-a="notif" aria-label="Notifications'+(n?', '+n+' unread':'')+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 004 0"/></svg>'+(n?'<i class="tnum">'+n+'</i>':'')+'</button>';
}
function ago(ts){var m=Math.floor((Date.now()-ts)/60000);return m<1?"Just now":m<60?m+" min ago":m<1440?Math.floor(m/60)+" h ago":Math.floor(m/1440)+" d ago"}
function annHtml(){
  var L=state.staff?[]:(cloud.bcl||[]);if(!L.length)return "";
  return '<div class="sec">Announcements</div>'+L.map(function(b){
    return '<div class="card" style="margin-bottom:10px">'+(b.image_path?'<img src="'+esc(BE.mediaUrl(b.image_path))+'" alt="" style="width:100%;border-radius:10px;display:block;margin-bottom:10px">':'')+
     (b.video_path?'<video controls playsinline preload="metadata" src="'+esc(BE.mediaUrl(b.video_path))+'" style="width:100%;border-radius:10px;display:block;margin-bottom:10px;background:#000"></video>':'')+
     '<b>'+esc(b.title)+'</b>'+(b.body?'<div style="white-space:pre-wrap;margin-top:4px">'+esc(b.body)+'</div>':'')+'<div class="tiny" style="margin-top:6px">'+ago(Date.parse(b.created_at))+'</div></div>'}).join("");
}
function vNotif(){
  var inB={};(cloud.bcl||[]).forEach(function(b){inB[b.id]=1});
  var k=notifKey(),list=NOTIF.filter(function(n){return n.to===k&&!(n.bid&&inB[n.bid])}).sort(function(a,b){return b.ts-a.ts});
  var h='<div class="top"><div class="brand">'+LOGO+'<small>Notifications</small></div><button class="btn sm ghost" data-a="nclose">Close</button></div><div class="title-block"><h1>Notifications</h1></div><div class="card">'+
   (list.length?list.map(function(n){return '<div class="nitem'+(n.fresh?' un':'')+'">'+esc(n.text)+'<small>'+ago(n.ts)+'</small></div>'}).join(""):(annHtml()?'<div class="empty">No booking updates yet.</div>':'<div class="empty">Nothing yet. Booking updates will show up here.</div>'))+'</div>'+annHtml();
  return h;
}
function nbHtml(){
  if(!state.nb||state.notif)return "";var n=unreadN();if(!n)return "";
  return '<div class="ntoast" role="status">You have '+n+' new notification'+(n>1?'s':'')+'<button data-a="notif">View</button></div>';
}
function openNotif(){
  var k=notifKey();if(!k)return;
  NOTIF.forEach(function(n){n.fresh=(n.to===k&&!n.read)});
  NOTIF.forEach(function(n){if(n.to===k)n.read=true});saveNotif();if(CLOUD)BE.markRead().catch(function(){});state.notif=true;state.nb=false;render(true);
}
function fmtWhen(a){return longDate(a.dateKey)+", "+t12(a.time)}
function approveAppt(id){
  if(CLOUD){cloudDecide(id,"confirm");return}

function barChart(items,unit){
  var W=340,H=170,L=30,B=22,T=16,R=4,n=items.length,max=0;
  items.forEach(function(x){if(x.value>max)max=x.value});
  var top=max<4?4:Math.ceil(max/2)*2,ph=H-B-T,slot=(W-L-R)/n,bw=Math.min(16,slot-5),g="",labelled=false,i;
  [0,top/2,top].forEach(function(v){
    var y=T+ph-ph*v/top;
    g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+v+'</text>';
  });
  for(i=0;i<n;i++){
    var it=items[i],x=L+slot*i+(slot-bw)/2,h=ph*it.value/top,y=T+ph-h,r=Math.min(4,h);
    g+='<rect class="hit" x="'+(L+slot*i)+'" y="'+T+'" width="'+slot+'" height="'+ph+'" data-tip="'+esc(longDate(it.k)+": "+it.value+" "+unit)+'"/>';
    if(it.value>0){
      g+='<path class="bar" d="M'+x+' '+(y+h)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+bw-r)+'Q'+(x+bw)+' '+y+' '+(x+bw)+' '+(y+r)+'V'+(y+h)+'Z"/>';
      if(it.value===max&&!labelled){labelled=true;g+='<text class="val" x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle">'+it.value+'</text>'}
    }
    if(i%2===(n-1)%2)g+='<text class="ax" x="'+(L+slot*i+slot/2)+'" y="'+(H-6)+'" text-anchor="middle">'+it.label+'</text>';
  }
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bar chart of bookings per day for the last 14 days. Use Show table for the exact values.">'+g+'</svg>';
}

function shrink(file,maxDim,q,cb){
  /* Tries three ways to read a phone photo, each with a time limit: createImageBitmap (handles big photos and rotation), an object URL, then a data URL. */
  var finished=false;
  function fin(v){if(finished)return;finished=true;cb(v)}
  function toJpeg(src,w0,h0){
    var sc=Math.min(1,maxDim/Math.max(w0,h0)),w=Math.max(1,Math.round(w0*sc)),h=Math.max(1,Math.round(h0*sc));
    var c=document.createElement("canvas");c.width=w;c.height=h;
    var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(src,0,0,w,h);
    var d=c.toDataURL("image/jpeg",q);
    return d&&d.length>200&&d.indexOf("data:image/jpeg")===0?d:null;
  }
  function viaImg(url,next,revoke){
    var im=new Image(),to=setTimeout(function(){im.onload=im.onerror=null;next()},12000);
    im.onerror=function(){clearTimeout(to);if(revoke)try{URL.revokeObjectURL(url)}catch(e){}next()};
    im.onload=function(){clearTimeout(to);var d=null;try{d=toJpeg(im,im.naturalWidth||im.width,im.naturalHeight||im.height)}catch(e){}if(revoke)try{URL.revokeObjectURL(url)}catch(e){}if(d)fin(d);else next()};
    im.src=url;
  }
  function m3(){
    try{var fr=new FileReader();fr.onerror=function(){fin(null)};fr.onload=function(){viaImg(fr.result,function(){fin(null)},false)};fr.readAsDataURL(file)}catch(e){fin(null)}
  }
  function m2(){
    try{if(window.URL&&URL.createObjectURL){viaImg(URL.createObjectURL(file),m3,true);return}}catch(e){}
    m3();
  }
  function m1(){
    if(!window.createImageBitmap){m2();return}
    var to=setTimeout(m2,12000),gone=false;
    function go(){if(gone)return;gone=true;clearTimeout(to);m2()}
    createImageBitmap(file).then(function(bm){
      if(gone){try{bm.close()}catch(e){}return}
      var d=null;try{d=toJpeg(bm,bm.width,bm.height)}catch(e){}
      try{bm.close()}catch(e){}
      if(d&&!gone){gone=true;clearTimeout(to);fin(d)}else go();
    },go);
  }
  m1();
}

function onUpload(id,files){
  var r=state.reg;if(!r||!files||!files.length)return;
  r.upMsg="";
  var k=id.slice(3);
  function fail(m){r.upMsg=m;render()}
  if(k==="photo"){
    shrink(files[0],480,.78,function(d){if(!d)return fail("That file could not be read as a photo.");r.photo=d;if(r.errs)delete r.errs.photo;render()});
  }else if(k==="gal"){
    var list=Array.prototype.slice.call(files,0,4-r.gallery.length),bad=0,badInfo="";r.galMsg="";
    if(!list.length)return;
    (function next(i){
      if(i>=list.length){if(r.errs&&r.gallery.length)delete r.errs.gallery;if(bad)r.galMsg=bad+" photo"+(bad>1?"s":"")+" could not be read"+(badInfo?" ("+badInfo+")":"")+". Try another photo or take a new one with the camera.";render();return}
      shrink(list[i],900,.72,function(d){if(d&&r.gallery.length<4)r.gallery.push(d);else{bad++;if(!badInfo)badInfo=(list[i].type||"unknown type")+", "+Math.round((list[i].size||0)/1024)+" KB"}next(i+1)});
    })(0);
  }else if(k==="reg"||k==="id"||k==="deg"){
    var f=files[0];
    if(f.type==="application/pdf"){
      if(f.size>(CLOUD?2048:300)*1024)return fail("That PDF is larger than "+(CLOUD?"2 MB":"300 KB")+". Upload a photo of the document instead, or a smaller PDF.");
      var fr=new FileReader();
      fr.onload=function(){r.docs[k]={name:f.name,type:"application/pdf",data:fr.result};if(r.errs)delete r.errs[k];render()};
      fr.onerror=function(){fail("That file could not be read.")};
      fr.readAsDataURL(f);
    }else if(/^image\//.test(f.type)){
      shrink(f,1400,.72,function(d){if(!d)return fail("That file could not be read as a photo.");r.docs[k]={name:f.name,type:"image/jpeg",data:d};if(r.errs)delete r.errs[k];render()});
    }else fail("Upload a photo or a PDF.");
  }
}

function dSlot(t,add){

  var key=state.sdate+"|"+t;d.blocked=d.blocked||[];
  var i=d.blocked.indexOf(key);
  if(add&&i<0)d.blocked.push(key);
  if(!add&&i>-1)d.blocked.splice(i,1);
  d.touched=true;saveRegistered();render();if(CLOUD)cloudExc(d);
}
function dOff(k,add){
  var d=myDoc();if(!d)return;
  var today=dkey(new Date());d.off=d.off||[];
  if(add){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k||"")||k<today)return;
    if(d.off.indexOf(k)<0)d.off.push(k);
    d.off.sort();state.offDate="";
  }else{
    var i=d.off.indexOf(k);if(i>-1)d.off.splice(i,1);
  }
  d.touched=true;saveRegistered();render();if(CLOUD)cloudExc(d);
}

}

function onFacUpload(id,files){

  if(k==="gal"){
    var list=Array.prototype.slice.call(files,0,4-r.gallery.length),bad=0,badInfo="";r.galMsg="";

    (function next(i){

   This prototype cannot send SMS, so the code is generated here and shown on screen in a demo note.
   To go live, replace the code generation in otpSend() with a call to your server, which sends the SMS

var PKEY="nirog-pat-v1",PNKEY="nirog-patients-v1",OTP_TTL=300000,OTP_WAIT=30000,OTP_TRIES=5;
/* literal keys here: loadPat() runs while the state object is built, before the var below is assigned */
function loadPat(){if(CLOUD)return null;try{var r=localStorage.getItem("nirog-pat-v1");if(r){var p=JSON.parse(r);if(p&&/^[6-9]\d{9}$/.test(p.phone)&&p.name)return {phone:p.phone,name:String(p.name)}}}catch(e){}return null}

function rememberName(ph,n){try{var r=localStorage.getItem(PNKEY),m=r?JSON.parse(r):{};m[ph]=n;localStorage.setItem(PNKEY,JSON.stringify(m))}catch(e){}}
function genCode(){
  var a=new Uint32Array(1);
  if(typeof crypto!=="undefined"&&crypto.getRandomValues)crypto.getRandomValues(a);else a[0]=Math.floor(Math.random()*4294967295);
  return String(100000+a[0]%900000);
}

function maskPhone(p){return "+91 "+p.slice(0,5)+" "+p.slice(5)}

function otpSend(resend){
  if(CLOUD){cloudOtpSend(resend);return}
  var o=state.otp;if(!o)return;
  if(!/^[6-9]\d{9}$/.test(o.phone)){o.err="Enter a valid 10-digit mobile number.";render();return}
  if(o.kind==="staff"){
    var u=staffByPhone(o.phone);
    if(!u){o.err="No staff or doctor account uses this number.";render();return}
    if(!u.active){o.err="This account is deactivated. Ask a super admin to reactivate it.";render();return}
  }
  var now=Date.now();
  if(resend&&now-o.at<OTP_WAIT){o.err="Wait "+Math.ceil((OTP_WAIT-(now-o.at))/1000)+" seconds before asking for a new code.";render();return}
  o.sent=genCode();o.at=now;o.exp=now+OTP_TTL;o.tries=0;o.code="";o.err="";o.stage="code";
  o.needName=o.kind==="patient"&&!knownName(o.phone);
  render();
}
function otpVerify(){
  if(CLOUD){cloudOtpVerify();return}
  var o=state.otp;if(!o)return;
  var now=Date.now();
  if(now>o.exp){o.err="This code has expired. Send a new one.";render();return}
  if(o.tries>=OTP_TRIES){o.err="Too many wrong tries. Send a new code.";render();return}
  if(!/^\d{6}$/.test(o.code)){o.err="Enter the 6-digit code.";render();return}
  if(o.code!==o.sent){o.tries++;o.err="That code is not right. "+(OTP_TRIES-o.tries)+" tries left.";render();return}
  if(o.kind==="patient"){
    var nm=o.needName?o.name.trim():knownName(o.phone);
    if(nm.length<2){o.err="Enter your name to finish.";render();return}
    rememberName(o.phone,nm);
    state.pat={phone:o.phone,name:nm};state.nb=true;savePat();
    var af=o.after,ph=o.phone;
    state.otp=null;
    if(af==="confirm"&&state.docId&&state.dateKey&&state.time){state.form.name=nm;state.form.phone=ph;state.errors={};state.view="confirm";state.tab="find"}
    else if(af==="appts"){state.tab="appts";state.view="list"}
    else{state.view="list";state.tab="find"}
    render(true);
    return;
  }
  var su=staffByPhone(o.phone);
  if(!su||!su.active){o.err="This account cannot sign in.";render();return}
  state.nb=true;state.staff=su.id;state.stab="ov";state.lf="all";state.showTable=false;state.addLead=false;
  state.otp=null;state.lmode="email";state.login={email:"",pass:"",err:""};
  render(true);
}

/* ---------- prescription PDF: pages are drawn on a canvas (so any script, including Hindi, renders) and wrapped in a minimal PDF ---------- */
function rxWrap(ctx,text,maxW){
  var out=[];
  String(text).split(/\n/).forEach(function(par){
    var line="";
    par.split(/\s+/).forEach(function(w){
      if(!w)return;
      var t=line?line+" "+w:w;
      if(ctx.measureText(t).width<=maxW){line=t;return}
      if(line)out.push(line);
      while(ctx.measureText(w).width>maxW&&w.length>1){var k=w.length;while(k>1&&ctx.measureText(w.slice(0,k)).width>maxW)k--;out.push(w.slice(0,k));w=w.slice(k)}
      line=w;
    });
    out.push(line);
  });
  return out;
}

  function rule(){need(16);ctx.fillStyle="#d5e3f2";ctx.fillRect(40,y,W-80,1);y+=18}

  y+=8;rule();
  if(r.diagnosis){text("Diagnosis",13,true,RED,40,20);text(r.diagnosis,15,false,INK,40,22);y+=10}
  var meds=r.medicines||[];
  if(meds.length){
    text("Medicines",13,true,RED,40,22);

      text((i+1)+". "+m.name+(m.dose?" - "+m.dose:""),15,true,INK,40,22);

    });

  }
  if(r.advice){text("Advice",13,true,RED,40,20);text(r.advice,15,false,INK,40,22);y+=10}

  else if(t.id==="rv-comment"&&cloud.rf){cloud.rf.comment=t.value}
  else if(t.id&&t.id.indexOf("rx-")===0&&cloud.rxf){
    var mm=/^rx-m-(\d+)-(name|dose|freq|days)$/.exec(t.id);
    if(mm){var mv=t.value;if(mm[2]==="days"){mv=mv.replace(/\D/g,"").slice(0,3);t.value=mv}if(cloud.rxf.meds[+mm[1]])cloud.rxf.meds[+mm[1]][mm[2]]=mv}
    else cloud.rxf[t.id.slice(3)]=t.value;
  }
  else if(t.id&&t.id.indexOf("ce-")===0&&cloud.edit){cloud.edit.f[t.id.slice(3)]=t.value}
  else if(t.id&&t.id.indexOf("rg-")===0&&state.reg){
    var rk=t.id.slice(3),rv=t.value;
    if(rk==="phone"||rk==="wa"){rv=rv.replace(/\D/g,"").slice(0,10);t.value=rv}
    if(rk==="pin"){rv=rv.replace(/\D/g,"").slice(0,6);t.value=rv}
    state.reg[rk]=rv;
    afterSched("rg",state.reg,rk);
    if(rk==="clinic"||rk==="addr"||rk==="city"||rk==="pin"){var fa=document.getElementById("rg-find");if(fa)fa.href=findUrl()}
    if(rk==="map"){var ms=document.getElementById("rg-map-status");if(ms)ms.textContent=mapStatus(rv)}
  }
  else if(t.id==="sc-offdate")state.offDate=t.value;
  else if(t.id&&t.id.indexOf("sc-")===0&&state.sched){var sk=t.id.slice(3);state.sched[sk]=t.value;afterSched("sc",state.sched,sk)}
  else if(t.id==="o-phone"&&state.otp){t.value=t.value.replace(/\D/g,"").slice(0,10);state.otp.phone=t.value}
  else if(t.id==="o-code"&&state.otp){t.value=t.value.replace(/\D/g,"").slice(0,8);state.otp.code=t.value}
  else if(t.id==="o-email"&&state.otp)state.otp.email=t.value.trim();
  else if(t.id==="ca-name"&&cloud.af)cloud.af.name=t.value;
  else if(t.id==="ca-phone"&&cloud.af){t.value=t.value.replace(/[^\d+ -]/g,"").slice(0,16);cloud.af.phone=t.value}
  else if(t.id==="ca-city"&&cloud.af)cloud.af.city=t.value;
  else if(t.id==="ca-kind"&&cloud.af)cloud.af.kind=t.value;
  else if(t.id==="ca-note"&&cloud.af)cloud.af.note=t.value;
  else if(t.id==="cl-name"&&cloud.lf)cloud.lf.name=t.value;
  else if(t.id==="cl-phone"&&cloud.lf){t.value=t.value.replace(/\D/g,"").slice(0,10);cloud.lf.phone=t.value}
  else if(t.id==="cl-spec"&&cloud.lf){cloud.lf.spec=t.value;cloud.lf.doc="";render()}
  else if(t.id==="cl-city"&&cloud.lf){cloud.lf.city=t.value;cloud.lf.doc=""}
  else if(t.id==="cl-doc"&&cloud.lf)cloud.lf.doc=t.value;
  else if(t.id==="bf-title"&&cloud.bf){cloud.bf.title=t.value;cloud.bf.ask=false}
  else if(t.id==="bf-body"&&cloud.bf){cloud.bf.body=t.value;cloud.bf.ask=false}
  else if(t.id==="bf-aud"&&cloud.bf){cloud.bf.aud=t.value;cloud.bf.ask=false;bcReachSoon()}
  else if(t.id==="bf-city"&&cloud.bf){cloud.bf.city=t.value;cloud.bf.ask=false;bcReachSoon()}
  else if(t.id==="cs-type"&&cloud.sf)cloud.sf.type=t.value;
  else if(t.id==="cs-value"&&cloud.sf)cloud.sf.value=t.value.replace(/[^\d.]/g,"").slice(0,6);
  else if(t.id==="cs-promo"&&cloud.sf)cloud.sf.promo=t.value;
  else if(t.id==="cs-minb"&&cloud.sf){t.value=t.value.replace(/\D/g,"").slice(0,6);cloud.sf.minb=t.value}
  else if(t.id==="cs-email"&&cloud.sf)cloud.sf.email=t.value.trim();
  else if(t.id==="cs-wa"&&cloud.sf){t.value=t.value.replace(/\D/g,"").slice(0,10);cloud.sf.wa=t.value}
  else if(t.id==="o-name"&&state.otp)state.otp.name=t.value;
  else if(t.id==="nm-phone"){t.value=t.value.replace(/\D/g,"").slice(0,10);state.nmem.phone=t.value}
  else if(t.id==="l-email")state.login.email=t.value;
  else if(t.id==="l-pass")state.login.pass=t.value;
  else if(t.id==="nl-name")state.nlead.name=t.value;
  else if(t.id==="nl-phone"){t.value=t.value.replace(/\D/g,"").slice(0,10);state.nlead.phone=t.value}
  else if(t.id==="nl-spec")state.nlead.spec=t.value;
  else if(t.id==="nm-name")state.nmem.name=t.value;
  else if(t.id==="nm-email")state.nmem.email=t.value;
  else if(t.id==="nm-pass")state.nmem.pass=t.value;
  else if(t.id==="nm-target")state.nmem.target=t.value;
});
app.addEventListener("change",function(ev){
  var t=ev.target;
  if(t&&t.id==="cl-city"&&cloud.lf){cloud.lf.city=t.value;cloud.lf.doc="";render()}
  if(t&&t.id&&t.id.indexOf("at-")===0){state.atime[t.id.slice(3)]=t.value}
  if(t&&t.type==="file"&&t.id&&t.id.indexOf("up-")===0){onUpload(t.id,t.files)}
  if(t&&t.type==="file"&&t.id&&t.id.indexOf("fu-")===0){onFacUpload(t.id,t.files)}
  if(t&&t.type==="file"&&t.id==="pu-photo"){onProfPhoto(t.files)}
  if(t&&t.type==="file"&&t.id==="rxp-add"){rxAddPhotos(t.files)}
  if(t&&t.type==="file"&&t.id==="bfp-img"){bcPickImage(t.files)}
  if(t&&t.type==="file"&&t.id==="bfp-vid"){bcPickVideo(t.files)}
});
app.addEventListener("submit",function(ev){
  ev.preventDefault();
  var fid=ev.target.id;
  if(fid==="clForm"){cloudAddLead();return}
  if(fid==="caForm"){ambSave();return}
  if(fid==="csForm"){cloudSaveSettings();return}
  if(fid==="otpForm"){if(state.otp&&state.otp.stage==="code")otpVerify();else otpSend(false);return}
  if(fid==="regForm"){submitReg();return}
  if(fid==="labForm"){submitLab();return}
  if(fid==="pfForm"){savePf();return}
  if(fid==="supForm"){saveSupForm();return}
  if(fid==="profForm"){saveProfile();return}
  if(fid==="fregForm"){submitFreg();return}
  if(fid==="schedForm"){saveSched();return}
  if(fid==="loginForm"){doLogin();return}
  if(fid==="leadForm"){addLead();return}
  if(fid==="memberForm"){addMember();return}
  var f=state.form,e={};
  if(f.name.trim().length<2)e.name="Enter the patient's full name.";
  if(!/^[6-9]\d{9}$/.test(f.phone))e.phone="Enter a valid 10-digit mobile number starting with 6, 7, 8 or 9.";
  if(!validAge(f.age))e.age="Enter the patient's age, 0 to 120.";
  if(SEXES.indexOf(f.sex)<0)e.sex="Select an option.";
  state.errors=e;
  if(e.name||e.phone||e.age||e.sex){render();var el=document.getElementById(e.name?"f-name":e.phone?"f-phone":e.age?"f-age":"f-sex");if(el)el.focus();return}
  book();
});
/* Back button support for the Android wrapper. Returns true when it handled the press. */
window.__nirogBack=function(){
  if(state.loAsk){state.loAsk=false;render(true);return true}
  if(state.call){var _id=state.call,_a=null;appts.forEach(function(x){if(x.id===_id)_a=x});if(CLOUD&&state.staff&&_a&&_a.cloud)BE.endCall(_id).catch(function(){});state.call=null;render(true);return true}
  if(state.staff)return false;
  if(state.ref){state.ref=false;render(true);return true}
  if(state.amb){state.amb=false;render(true);return true}
  if(state.lb){state.lb=null;render();return true}
  if(state.view==="confirm"){state.view="doctor";render(true);return true}
  if(state.view==="doctor"||state.view==="done"||state.view==="login"||state.view==="register"||state.view==="freg"||state.view==="profile"||state.view==="otp"){state.view="list";state.resched=null;render(true);return true}
  if(state.lb){state.lb=null;render();return true}
  if(state.tab==="appts"||state.tab==="labs"){state.tab="find";render(true);return true}
  return false;
};
/* Press and hold the Yada+ name for about a second to open staff sign-in. This is the way in for the Android and iOS apps, which have no address bar. */
(function(){
  var holdT=null;
  function stop(){if(holdT){clearTimeout(holdT);holdT=null}}
  app.addEventListener("pointerdown",function(ev){
    var b=ev.target.closest&&ev.target.closest(".brand");
    if(!b||state.staff)return;
    stop();
    holdT=setTimeout(function(){holdT=null;state.view="login";state.login={email:"",pass:"",err:""};render(true)},1100);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(n){app.addEventListener(n,stop)});
  app.addEventListener("contextmenu",function(ev){if(ev.target.closest&&ev.target.closest(".brand"))ev.preventDefault()});
})();
/* Deep links: #staff opens staff sign-in, #register the doctor sign-up, #facility the lab, centre and hospital sign-up. */
function hashRoute(){
  var h="";try{h=location.hash}catch(e){}
  if(/(^|[#&])staff$/.test(h)&&!state.staff){state.view="login";state.login={email:"",pass:"",err:""};return true}
  if(/(^|[#&])register$/.test(h)&&!state.staff){state.view="register";state.reg=newReg();state.regDone=null;state.tab="find";return true}
  if(/(^|[#&])facility$/.test(h)&&!state.staff){state.view="freg";state.fr=newFr();state.frDone=null;state.tab="labs";return true}
  return false;
}
try{window.addEventListener("hashchange",function(){if(hashRoute())render(true)})}catch(e){}
var _oh="";try{_oh=location.hash}catch(e){}
if(CLOUD&&/access_token=|error_description=/.test(_oh)){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}
else _oh="";
hashRoute();
render();
if(CLOUD&&_oh){setTimeout(function(){googleDone(_oh)},0)}
if(CLOUD){cloudLoadDir().then(function(){return cloudRestore()}).then(function(){if(BE.signedIn())cloudStartPoll()})}
})();
</script>
