name: Build APK

on:
  push:
    paths-ignore:
      - "web/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Public client configuration only (anon key). Empty secrets build a local demo-mode app.
      - name: Write public config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: scripts/make-config.sh

      # The GitHub runner image already includes the Android SDK, so no separate SDK setup step is needed.
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -PbuildNo=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nirog-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=1.0.0.${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk Nirog-v$V.apk
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk Nirog-v$V.apk --title "Nirog Android app v$V (debug build)" --notes "Version $V. Debug-signed test build. Install on an Android phone for testing." --target "${{ github.sha }}"
