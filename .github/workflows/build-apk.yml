name: Build APK

on:
  push:
    paths-ignore:
      - "web/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub runner image already includes the Android SDK, so no separate SDK setup step is needed.
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nirog-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Nirog-debug.apk
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk Nirog-debug.apk --title "Nirog Android app (debug build)" --notes "Debug-signed test build. Install on an Android phone for testing." --target "${{ github.sha }}"
