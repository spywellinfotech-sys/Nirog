name: Build Play Store bundle

# Manual run: builds the signed .aab you upload to Google Play Console.
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    the upload keystore file, base64 encoded
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
#   PLAY_SERVICE_ACCOUNT_JSON  (optional) Google Play service account key; when set the bundle is uploaded to Play automatically
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to (needs PLAY_SERVICE_ACCOUNT_JSON)"
        type: choice
        default: internal
        options: [internal, alpha, production]
      release_notes:
        description: "What's new (English)"
        default: "Improvements and bug fixes."

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Write public config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: scripts/make-config.sh
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build signed bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease -PbuildNo=${{ github.run_number }} --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: yada-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Prepare release notes
        if: env.PLAY_JSON != ''
        run: |
          mkdir -p whatsnew
          printf '%s' "${{ github.event.inputs.release_notes }}" | head -c 480 > whatsnew/whatsnew-en-US
      - name: Upload to Google Play
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.yadaplus.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed
          whatsNewDirectory: whatsnew
      - name: Note when Play upload is skipped
        if: env.PLAY_JSON == ''
        run: echo "PLAY_SERVICE_ACCOUNT_JSON is not set, so the bundle was only saved as an artifact."
