name: Nirog
options:
  bundleIdPrefix: com.nirog
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Nirog:
    type: application
    platform: iOS
    sources:
      - path: Nirog
        excludes:
          - Web
      - path: Nirog/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nirog.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Nirog/Info.plist
        CODE_SIGN_STYLE: Automatic
